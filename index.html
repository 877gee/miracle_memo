        ]

      thoughtGatheringArchives: [
        {
          id: 'tga_sample_1',
          title: '강의 기본 예시 (중식 식사 및 집안일)',
          date: '2026-10-20',
          leftItems: [
            { id: 'base_1', num: 1, text: '짜장면 먹기', color: 'orange', completed: false },
            { id: 'base_2', num: 2, text: '커피 마시기', color: 'pink', completed: true },
            { id: 'base_3', num: 3, text: '집청소 하기', color: 'blue', completed: false }
          ],
          rightItems: [
            { id: 'derived_1', num: 1, text: '탕수육 먹기', color: 'orange', completed: false },
            { id: 'derived_2', num: 1, text: '군만두 먹기', color: 'orange', completed: false },
            { id: 'derived_3', num: 3, text: '빨래 개기', color: 'blue', completed: true },

        { id: 'dump_3', text: '이번 주말까지 신규 프로젝트 1차 기획안 초안 2페이지 작성', tag: '할일', date: '10-20', status: 'active' },
        { id: 'dump_4', text: '모닝 루틴에서 핸드폰 보지 않고 바로 브레인덤프 진행하기', tag: '메모', date: '10-19', status: 'done' }
      ],

        {

          date: '2026-10-20'

    };

    let appState = null;
    let timerInterval = null;
    let timerSecondsLeft = 180;
    let activeBaseNum = 1; // Currently selected parent base task for derived tasks

    // Load State from LocalStorage
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          appState = JSON.parse(saved);
          if (!appState.pages) appState.pages = DEFAULT_DATA.pages;
          if (!appState.activityDays) appState.activityDays = DEFAULT_DATA.activityDays;
          if (!appState.verticalNotes) appState.verticalNotes = DEFAULT_DATA.verticalNotes;
          if (!appState.thoughtGathering) appState.thoughtGathering = DEFAULT_DATA.thoughtGathering;
          if (!appState.thoughtGatheringArchives) appState.thoughtGatheringArchives = DEFAULT_DATA.thoughtGatheringArchives;
          if (!appState.brainDumps) appState.brainDumps = DEFAULT_DATA.brainDumps;
          if (!appState.customLectureNotes) appState.customLectureNotes = DEFAULT_DATA.customLectureNotes;
          if (!appState.customPages) appState.customPages = {};
          
          // Ensure page titles are clean in English
          appState.pages.forEach(p => {
            if (p.id === 'guide') p.title = 'guide';
            if (p.id === 'braindump') p.title = 'brain dump';
            if (p.id === 'verticalline') p.title = '3-line note';
            if (p.id === 'plantask') p.title = 'plan & task';
            if (p.id === 'pagemanager') p.title = 'pages';
          });
        } else {
          appState = JSON.parse(JSON.stringify(DEFAULT_DATA));
          saveState();
        }
      } catch (e) {
        console.error('Error loading state:', e);
        appState = JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
      recordActivityToday();
      if (appState.thoughtGathering?.leftItems?.length > 0) {
        activeBaseNum = appState.thoughtGathering.leftItems[0].num;
      }
    }

    function recordActivityToday() {
      const todayStr = '2026-10-20';
      if (!appState.activityDays) appState.activityDays = [];
      if (!appState.activityDays.includes(todayStr)) {
        appState.activityDays.push(todayStr);
      }
    }

    function saveState() {
      recordActivityToday();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('Error saving state:', e);
      }
      updateTopWidgets();
    }

    // Toast Utility (Sandbox safe, no alert)
    function showToast(message, type = 'normal') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `px-3.5 py-2.5 rounded-2xl shadow-float text-xs font-semibold flex items-center gap-2 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${
        type === 'success' ? 'bg-neutral-900 text-white' : 'bg-white text-neutral-900 border border-neutral-200'
      }`;
      toast.innerHTML = `
        <span>${type === 'success' ? '✓' : 'ℹ'}</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Modal Utility
    function openModal(htmlContent) {
      const modal = document.getElementById('appModal');
      const content = document.getElementById('appModalContent');
      content.innerHTML = htmlContent;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      const modal = document.getElementById('appModal');
      modal.classList.add('hidden');
    }

    // Update Top Widgets
    function updateTopWidgets() {
      // Top mini widgets removed for clean studio aesthetic
    }

    function renderTabs() {
      const tabBar = document.getElementById('dynamicTabBar');
      if (!tabBar) return;
      tabBar.innerHTML = '';

      appState.pages.forEach((page) => {
        const isActive = appState.activeTab === page.id;
        const btn = document.createElement('button');
        btn.className = `text-left font-['Tuffy'] transition-colors duration-150 py-0.5 whitespace-nowrap ${
          isActive 
            ? 'text-neutral-950 font-black text-sm sm:text-base' 
            : 'text-neutral-400 hover:text-neutral-700 font-bold text-sm sm:text-base'
        }`;
        btn.innerHTML = `<span>${page.title.toLowerCase()}</span>`;
        btn.addEventListener('click', () => {
          switchTab(page.id);
        });
        tabBar.appendChild(btn);
      });

      // Update mobile bottom tab highlighting
      document.querySelectorAll('[data-bottom-tab]').forEach(btn => {
        const tid = btn.getAttribute('data-bottom-tab');
        if (tid === appState.activeTab) {
          btn.className = 'py-1.5 px-0.5 text-[11px] font-black text-white bg-white/20 rounded-xl transition-colors truncate';
        } else {
          btn.className = 'py-1.5 px-0.5 text-[11px] font-medium text-neutral-400 hover:text-white transition-colors truncate';
        }
      });
    }

    window.switchTab = function(tabId) {
      appState.activeTab = tabId;
      saveState();
      renderTabs();
      renderActivePage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Main Page View Switcher
    function renderActivePage() {
      const container = document.getElementById('pageViewContainer');
      if (!container) return;

      const currentTab = appState.activeTab;

      if (currentTab === 'guide') {
        renderGuidePage(container);
      } else if (currentTab === 'braindump') {
        renderBrainDumpPage(container);
      } else if (currentTab === 'verticalline') {
        renderVerticalLinePage(container);
      } else if (currentTab === 'plantask') {
        renderPlanTaskPage(container);
      } else if (currentTab === 'pagemanager') {
        renderPageManager(container);
      } else {
        renderCustomPage(container, currentTab);
      }
    }

    function renderLectureNotes() {
      const container = document.getElementById('lectureNoteContainer');
      if (!container) return;
      const notes = appState.customLectureNotes || [];
      if (notes.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-xs text-neutral-400">등록된 강의 필기가 없습니다. 새 노트를 추가해보세요.</div>`;
        return;
      }
      container.innerHTML = notes.map(n => `
        <div class="p-3.5 rounded-2xl bg-neutral-50 border border-neutral-100">
          <div class="flex items-center justify-between text-[11px] mb-1">
            <span class="font-bold text-neutral-500 bg-white px-2 py-0.5 rounded-full border border-neutral-200/60">${escapeHtml(n.chapter)}</span>
            <div class="flex items-center gap-2">
              <span class="text-neutral-400">${escapeHtml(n.date)}</span>
              <button onclick="deleteCustomLectureNote('${n.id}')" class="text-neutral-400 hover:text-red-500">삭제</button>
            </div>
          </div>
          <h4 class="text-xs sm:text-sm font-bold text-neutral-900 mb-1">${escapeHtml(n.title)}</h4>
          <p class="text-xs text-neutral-600 leading-relaxed whitespace-pre-line">${escapeHtml(n.content)}</p>
        </div>
      `).join('');
    }

    window.deleteCustomLectureNote = function(id) {
      appState.customLectureNotes = appState.customLectureNotes.filter(n => n.id !== id);
      saveState();
      renderLectureNotes();
      showToast('강의 노트가 삭제되었습니다.');
    };

      const submitBtn = document.getElementById('submitDumpBtn');

      const handleAdd = () => {
        const raw = textarea.value.trim();
        if (!raw) return;

        const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) return;

        const now = new Date();
        const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

        lines.forEach(line => {
          appState.brainDumps.unshift({
            id: 'dump_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            text: line,
            tag: selectedDumpTag,
            date: dateStr,
            status: 'active'
          });
        });

        saveState();
        textarea.value = '';
        renderDumpItems(currentDumpFilter);
        // Silent addition
      };

      if (submitBtn) submitBtn.addEventListener('click', handleAdd);
      if (textarea) {
        textarea.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            handleAdd();
          }
        });
      }

      // Timer removed as requested
    }

    window.toggleDumpStatus = function(id) {
      const dump = appState.brainDumps.find(d => d.id === id);
      if (dump) {
        dump.status = dump.status === 'active' ? 'done' : 'active';
        saveState();
        renderDumpItems(currentDumpFilter);
      }
    };

    window.deleteDump = function(id) {
      appState.brainDumps = appState.brainDumps.filter(d => d.id !== id);
      saveState();
      renderDumpItems(currentDumpFilter);
      showToast('생각 카드가 삭제되었습니다.');
    };

    window.sendDumpToVertical = function(id) {
      const dump = appState.brainDumps.find(d => d.id === id);
      if (!dump) return;
      const active = getActiveVNote();
      if (active) {
        if (!active.rows) active.rows = [];
        const emptyRow = active.rows.find(r => !r.fact.trim());
        if (emptyRow) {
          emptyRow.fact = dump.text;
        } else {
          active.rows.push({
            fact: dump.text,
            thought: ''
          });
        }
        dump.status = 'done';
        saveState();
        renderDumpItems(currentDumpFilter);
        showToast('세 줄 노트 표의 사실(Fact)로 즉시 추가되었습니다! 📏', 'success');
      }
    };

    window.sendDumpToThoughtGathering = function(id) {
      const dump = appState.brainDumps.find(d => d.id === id);
      if (!dump) return;
      
      const tg = appState.thoughtGathering;
      if (!tg.leftItems) tg.leftItems = [];
      const existingNums = tg.leftItems.map(i => i.num);
      let nextNum = 1;
      while (existingNums.includes(nextNum)) {
        nextNum++;
      }
      const colorObj = getPresetColor(nextNum);

      tg.leftItems.push({
        id: 'base_' + Date.now(),
        num: nextNum,
        text: dump.text,
        color: colorObj.id,
        completed: false
      });
      activeBaseNum = nextNum;
      dump.status = 'done';
      saveState();
      renderDumpItems(currentDumpFilter);
      showToast(`계획과 할일 베이스 ${nextNum}번으로 등록되었습니다! 🎯`, 'success');

    window.selectVNoteFromModal = function(id) {
      selectVNote(id);
      closeModal();
    };

    window.addNewVNoteFromModal = function() {
      closeModal();
      addNewVNoteSheet();
    };

    window.deleteVNoteFromModal = function(id) {
      appState.verticalNotes = appState.verticalNotes.filter(n => n.id !== id);
      if (activeVNoteId === id) {
        activeVNoteId = appState.verticalNotes[0]?.id || null;
      }
      saveState();
      openVNoteListModal();
      const container = document.getElementById('pageViewContainer');
      if (container && appState.activeTab === 'verticalline') {
        renderVerticalLinePage(container);
      }
      showToast('노트가 삭제되었습니다.');
    };

    window.selectVNote = function(id) {
      activeVNoteId = id;
      renderActiveVNoteCanvas();
      const container = document.getElementById('pageViewContainer');
      if (container && appState.activeTab === 'verticalline') {
        renderVerticalLinePage(container);
      }
    };

    window.addNewVNoteSheet = function() {
      const newId = 'vnote_' + Date.now();
      const newNote = {
        id: newId,
        title: '새 세 줄 노트 ' + (appState.verticalNotes.length + 1),
        date: new Date().toISOString().slice(0, 10),
        category: '자율 정리',
        rows: [
          { fact: '', thought: '' },
          { fact: '', thought: '' },
          { fact: '', thought: '' },
          { fact: '', thought: '' },
          { fact: '', thought: '' }
        ],
        conclusion: '',
        actionPlan: ''
      };
      appState.verticalNotes.unshift(newNote);
      activeVNoteId = newId;
      saveState();
      renderVerticalLinePage(document.getElementById('pageViewContainer'));
      showToast('새 세 줄 노트가 펼쳐졌습니다!', 'success');
    };

    window.deleteActiveVNote = function() {
      const active = getActiveVNote();
      if (!active) return;
      appState.verticalNotes = appState.verticalNotes.filter(n => n.id !== active.id);
      activeVNoteId = appState.verticalNotes[0]?.id || null;
      saveState();
      renderVerticalLinePage(document.getElementById('pageViewContainer'));
      showToast('노트가 삭제되었습니다.');
    };

    window.updateActiveVNoteTitle = function(title) {
      const active = getActiveVNote();
      if (active) {
        active.title = title.trim() || '무제 세 줄 노트';
        saveState();
      }
    };

    window.updateVRowFact = function(index, value) {
      const active = getActiveVNote();
      if (active && active.rows && active.rows[index]) {
        active.rows[index].fact = value;
        saveState();
      }
    };

    window.updateVRowThought = function(index, value) {
      const active = getActiveVNote();
      if (active && active.rows && active.rows[index]) {
        active.rows[index].thought = value;
        saveState();
      }
    };

    window.addVRow = function() {
      const active = getActiveVNote();
      if (active) {
        if (!active.rows) active.rows = [];
        active.rows.push({ fact: '', thought: '' });
        saveState();
        renderActiveVNoteCanvas();
      }
    };

    window.deleteVRow = function(rowIndex) {
      const active = getActiveVNote();
      if (active && active.rows) {
        active.rows.splice(rowIndex, 1);
        if (active.rows.length === 0) {
          active.rows.push({ fact: '', thought: '' });
        }
        saveState();
        renderActiveVNoteCanvas();
      }
    };

    window.updateActiveVNoteConclusion = function(text) {
      const active = getActiveVNote();
      if (active) {
        active.conclusion = text;
        saveState();
      }
    };

    window.updateActiveVNoteAction = function(text) {
      const active = getActiveVNote();
      if (active) {
        active.actionPlan = text;
        saveState();
      }
    };

    window.clearActiveVAction = function() {
      const active = getActiveVNote();
      if (active) {
        active.actionPlan = '';
        saveState();
        renderActiveVNoteCanvas();
      }
    };

    window.sendActiveVActionToPlan = function() {
      const active = getActiveVNote();
      if (!active || !active.actionPlan) {
        showToast('등록할 자발적 할일이 없습니다.');
        return;
      }

      const tg = appState.thoughtGathering;
      if (!tg.leftItems) tg.leftItems = [];
      const existingNums = tg.leftItems.map(i => i.num);
      let nextNum = 1;
      while (existingNums.includes(nextNum)) {
        nextNum++;
      }
      const colorObj = getPresetColor(nextNum);

      tg.leftItems.push({
        id: 'base_' + Date.now(),
        num: nextNum,
        text: active.actionPlan,
        color: colorObj.id,
        completed: false
      });
      activeBaseNum = nextNum;
      saveState();
      showToast(`계획과 할일 베이스 ${nextNum}번으로 전송되었습니다! 🎯`, 'success');
    };

    function renderThoughtGatheringView() {
      const leftContainer = document.getElementById('tgLeftList');
      const rightContainer = document.getElementById('tgRightList');
      const groupedContainer = document.getElementById('tgGroupedContainer');
      const indicatorContainer = document.getElementById('tgActiveBaseIndicator');

      if (!leftContainer || !rightContainer) return;

      const tg = appState.thoughtGathering || { leftItems: [], rightItems: [] };
      const left = tg.leftItems || [];
      const right = tg.rightItems || [];

      // Validate activeBaseNum
      if (left.length > 0 && !left.some(i => i.num === activeBaseNum)) {
        activeBaseNum = left[0].num;
      }

      // Render Active Base Indicator in Right Column
      if (indicatorContainer) {
        if (left.length === 0) {
          indicatorContainer.innerHTML = `
            <span class="text-xs text-neutral-400">왼쪽에 먼저 베이스 할 일을 추가해주세요.</span>
          `;
        } else {
          const activeItem = left.find(i => i.num === activeBaseNum) || left[0];
          const colorObj = getPresetColor(activeItem.num);

          indicatorContainer.innerHTML = `
            <div class="flex items-center gap-1.5 flex-1 min-w-0 pr-1">
              <span class="text-xs font-extrabold px-2 py-0.5 rounded-lg border ${colorObj.badgeClass} truncate max-w-[180px]">
                ${activeItem.num}. ${escapeHtml(activeItem.text)}
              </span>
            </div>
            <!-- Quick switcher dropdown if multiple base tasks -->
            <select onchange="setActiveBaseNum(this.value)" class="text-[11px] font-bold text-neutral-700 bg-white border border-neutral-200 rounded-lg px-2 py-1 shrink-0 focus:outline-none">
              ${left.map(i => `
                <option value="${i.num}" ${i.num === activeBaseNum ? 'selected' : ''}>
                  ${i.num}번 (${escapeHtml(i.text.slice(0, 8))}...)
                </option>
              `).join('')}
            </select>
          `;
        }
      }

      // Render Left (Base) Item Card
      const renderBaseRow = (item) => {
        const isDone = item.completed;
        const colorObj = getPresetColor(item.num);
        const isActiveForDerive = item.num === activeBaseNum;

        return `
          <div class="p-2 sm:p-2.5 rounded-xl transition-all space-y-1 ${
            isActiveForDerive ? 'bg-white border-2 border-neutral-900 shadow-soft' : 'bg-neutral-50/80 border border-neutral-200/70 hover:bg-white hover:border-neutral-300'
          } ${isDone ? 'opacity-60' : ''}">
            
            <div class="flex items-center justify-between gap-1">
              <div class="flex items-center gap-1.5">
                <button onclick="toggleTGBaseTask('${item.id}')" title="완료 토글" class="w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0 ${isDone ? 'bg-neutral-900 border-neutral-900 text-white' : 'border-neutral-300 hover:border-neutral-900'}">
                  ${isDone ? '✓' : ''}
                </button>
                <!-- Number Badge: 30% more compact -->
                <span class="text-[10px] font-black px-1.5 py-0.5 rounded-md border ${colorObj.badgeClass} font-['Tuffy']">
                  ${item.num}
                </span>
              </div>

              <!-- Action: [+ 할 일] Button & Delete (30% more compact) -->
              <div class="flex items-center gap-1">
                <button onclick="setActiveBaseNum(${item.num})" class="px-2 py-0.5 rounded-lg text-[10px] font-bold transition-all ${
                  isActiveForDerive ? 'bg-neutral-900 text-white shadow-soft' : 'bg-white border border-neutral-200 text-neutral-800 hover:bg-neutral-100'
                }" title="할 일 작성하기">
                  <span>${isActiveForDerive ? '작성 중' : '+ 할 일'}</span>
                </button>
                <button onclick="deleteTGBaseItem('${item.id}')" class="text-neutral-300 hover:text-red-500 text-xs px-1" title="삭제">✕</button>
              </div>
            </div>

            <!-- Auto-expanding Multiline Textarea (No Scrollbar, expands to show all content) -->
            <div>
              <textarea 
                rows="1" 
                oninput="adjustTextareaHeight(this); updateTGBaseText('${item.id}', this.value)"
                class="v-auto-expand w-full text-xs font-bold text-neutral-900 pb-0.5 ${colorObj.hlClass} ${isDone ? 'line-through text-neutral-400' : ''} bg-transparent focus:bg-white focus:outline-none border-b border-transparent focus:border-neutral-300 rounded px-1 transition-all resize-none overflow-hidden leading-relaxed block"
              >${escapeHtml(item.text)}</textarea>
            </div>

          </div>
        `;
      };

      // Render Right (Derived) Item Card
      const renderDerivedRow = (item) => {
        const isDone = item.completed;
        const colorObj = getPresetColor(item.num);

        return `
          <div class="p-2 sm:p-2.5 rounded-xl bg-neutral-50/80 border border-neutral-200/70 hover:bg-white hover:border-neutral-300 transition-all space-y-1 ${isDone ? 'opacity-60' : ''}">
            
            <div class="flex items-center justify-between gap-1">
              <div class="flex items-center gap-1.5">
                <button onclick="toggleTGDerivedTask('${item.id}')" title="완료 토글" class="w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0 ${isDone ? 'bg-neutral-900 border-neutral-900 text-white' : 'border-neutral-300 hover:border-neutral-900'}">
                  ${isDone ? '✓' : ''}
                </button>
                <!-- Number Badge: 30% more compact -->
                <span class="text-[10px] font-black px-1.5 py-0.5 rounded-md border ${colorObj.badgeClass} font-['Tuffy']">
                  ${item.num}
                </span>
              </div>

              <!-- Delete Button -->
              <div class="flex items-center gap-1">
                <button onclick="deleteTGDerivedItem('${item.id}')" class="text-neutral-300 hover:text-red-500 text-xs px-1" title="삭제">✕</button>
              </div>
            </div>

            <!-- Auto-expanding Multiline Textarea (No Scrollbar, expands to show all content) -->
            <div>
              <textarea 
                rows="1" 
                oninput="adjustTextareaHeight(this); updateTGDerivedText('${item.id}', this.value)"
                class="v-auto-expand w-full text-xs font-semibold text-neutral-900 pb-0.5 ${colorObj.hlClass} ${isDone ? 'line-through text-neutral-400' : ''} bg-transparent focus:bg-white focus:outline-none border-b border-transparent focus:border-neutral-300 rounded px-1 transition-all resize-none overflow-hidden leading-relaxed block"
              >${escapeHtml(item.text)}</textarea>
            </div>

          </div>
        `;
      };

      // Populate Left Column
      if (left.length === 0) {
        leftContainer.innerHTML = '';
      } else {
        leftContainer.innerHTML = left.map(item => renderBaseRow(item)).join('');
      }

      // Populate Right Column
      if (right.length === 0) {
        rightContainer.innerHTML = '';
      } else {
        rightContainer.innerHTML = right.map(item => renderDerivedRow(item)).join('');
      }

      // Render Grouped Section (Base + Derived)
      if (groupedContainer) {
        if (left.length === 0) {
          groupedContainer.innerHTML = `<div class="p-4 text-center text-xs text-neutral-400">모아진 할 일이 없습니다.</div>`;
        } else {
          setTimeout(() => {
        document.querySelectorAll('.v-auto-expand').forEach(t => adjustTextareaHeight(t));
      }, 10);
      groupedContainer.innerHTML = left.map(base => {
            const derivedForThis = right.filter(d => d.num === base.num);
            const colorObj = getPresetColor(base.num);
            const totalCount = 1 + derivedForThis.length;
            const doneCount = (base.completed ? 1 : 0) + derivedForThis.filter(d => d.completed).length;

            return `
              <div class="p-3.5 rounded-2xl bg-neutral-50/80 border border-neutral-200/60 space-y-2.5">
                <div class="flex items-center justify-between pb-2 border-b border-neutral-200/50">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-black px-2 py-0.5 rounded-md border ${colorObj.badgeClass}">${base.num}번</span>
                    <span class="text-xs font-bold text-neutral-900 ${base.completed ? 'line-through text-neutral-400' : ''}">
                      ${escapeHtml(base.text)}
                    </span>
                  </div>
                  <span class="text-[11px] text-neutral-500 font-semibold">${doneCount}/${totalCount} 완료</span>
                </div>
                
                <!-- Chips for Base & Derived items -->
                <div class="flex flex-wrap gap-1.5">
                  <span class="text-xs px-2.5 py-1 rounded-xl bg-white border border-neutral-200 text-neutral-900 font-bold flex items-center gap-1.5 ${base.completed ? 'line-through text-neutral-400' : ''}">
                    <span>${base.completed ? '✓' : '•'}</span>
                    <span>${escapeHtml(base.text)}</span>
                  </span>
                  ${derivedForThis.map(d => `
                    <span class="text-xs px-2.5 py-1 rounded-xl bg-white/90 border border-neutral-200/80 text-neutral-700 flex items-center gap-1.5 ${d.completed ? 'line-through text-neutral-400' : ''}">
                      <span>${d.completed ? '✓' : '↳'}</span>
                      <span>${escapeHtml(d.text)}</span>
                    </span>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('');
        }
      }
    }

    // Submit Base Task (Left)
    window.submitDirectBaseTask = function() {
      const input = document.getElementById('directLeftInput');
      if (!input) return;
      const raw = input.value.trim();
      if (!raw) return;

      const tg = appState.thoughtGathering;
      if (!tg.leftItems) tg.leftItems = [];

      const existingNums = tg.leftItems.map(i => i.num);
      let nextNum = 1;
      while (existingNums.includes(nextNum)) {
        nextNum++;
      }
      const colorObj = getPresetColor(nextNum);

      tg.leftItems.push({
        id: 'base_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        num: nextNum,
        text: raw,
        color: colorObj.id,
        completed: false
      });
      activeBaseNum = nextNum;
      saveState();
      renderThoughtGatheringView();
      input.value = '';
      input.blur();
      setTimeout(() => {
        const freshInput = document.getElementById('directLeftInput');
        if (freshInput) freshInput.focus();
      }, 50);
      // Silent addition
    };

    // Activate Parent Base for Deriving
    window.setActiveBaseNum = function(num) {
      activeBaseNum = parseInt(num, 10);
      renderThoughtGatheringView();
      const rightInput = document.getElementById('directRightInput');
      if (rightInput) {
        rightInput.focus();
        rightInput.placeholder = '엔터로 추가';
      }
      // Silent activation
    };

    // Submit Derived Task (Right) - Automatically binds to activeBaseNum & color!
    window.submitDirectDerivedTask = function() {
      const input = document.getElementById('directRightInput');
      if (!input) return;
      const raw = input.value.trim();
      if (!raw) return;

      const tg = appState.thoughtGathering;
      if (!tg.rightItems) tg.rightItems = [];

      // Auto-create base 1 if none exists

            <div class="mt-5">
              <label class="block text-xs font-bold text-neutral-700 mb-1.5">자유 메모 공간 (자동 저장)</label>
              <textarea id="customPageContent" rows="12" placeholder="자유롭게 강의 내용이나 생각을 기록하세요..." class="w-full text-xs sm:text-sm p-3.5 rounded-2xl border border-neutral-200 bg-neutral-50/50 focus:bg-white focus:outline-none focus:border-neutral-900 leading-relaxed">${escapeHtml(pageData.content || '')}</textarea>
              <div class="flex justify-end mt-3">
                <button id="saveCustomContentBtn" class="px-4 py-2 rounded-xl bg-neutral-900 text-white text-xs font-bold hover:bg-neutral-800 transition-colors">
                  내용 저장하기
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('saveCustomContentBtn').addEventListener('click', () => {
        const text = document.getElementById('customPageContent').value;
        if (!appState.customPages) appState.customPages = {};
        appState.customPages[pageId] = { content: text };
        saveState();
        showToast('메모가 저장되었습니다.', 'success');
      });
    }

    function openResetConfirmModal(pageManagerContainer) {
      const html = `
        <div class="space-y-3.5">
          <div class="flex items-center justify-between pb-2 border-b border-neutral-100">
            <h4 class="text-sm sm:text-base font-bold text-neutral-900">기본 데이터 초기화 확인</h4>
            <button onclick="closeModal()" class="text-neutral-400 hover:text-neutral-900 text-sm">✕</button>
          </div>
          <p class="text-xs text-neutral-600 leading-relaxed">
            작성하신 모든 메모, 세 줄 노트, 생각 모으기 데이터가 강의 기본 예시 상태로 복원됩니다.<br>
            정말로 초기화하시겠습니까?
          </p>
          <div class="flex justify-end gap-2 pt-2 border-t border-neutral-100">
            <button onclick="closeModal()" class="px-3.5 py-1.5 text-xs text-neutral-600 rounded-xl hover:bg-neutral-100">취소</button>
            <button id="confirmResetBtn" class="px-4 py-1.5 text-xs font-bold text-white bg-red-600 rounded-xl hover:bg-red-700">초기화 진행</button>
          </div>
        </div>
      `;
      openModal(html);

      document.getElementById('confirmResetBtn').addEventListener('click', () => {
        appState = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveState();
        closeModal();
        renderTabs();
        renderPageManager(pageManagerContainer);
        showToast('기본 데이터로 초기화되었습니다.', 'success');
      });
    }

    function exportAppData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `miracle_memo_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('백업 파일이 다운로드되었습니다.', 'success');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initialize Everything on Window Load
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderTabs();
      renderActivePage();
      updateTopWidgets();

      // Header quick action buttons removed as requested
    });

  </script>
</body>
</html>
